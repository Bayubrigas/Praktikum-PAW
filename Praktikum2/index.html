<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6A64F1',
                        dark: '#1e1e1e',
                        darker: '#121212'
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-100 text-gray-800 dark:bg-darker dark:text-gray-100 min-h-screen font-sans">
    <header class="bg-white dark:bg-dark shadow-md sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-primary tracking-tight">
                <i class="fas fa-sticky-note mr-2"></i>Quick Notes
            </h1>

            <div class="flex gap-3">
                <button id="theme-toggle-button" 
                        onclick="toggleTheme()" 
                        class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors w-10 h-10 flex items-center justify-center text-xl">
                    🌙
                </button>

                <button onclick="openNoteDialog()" 
                    class="bg-primary hover:bg-indigo-600 text-white px-4 py-2 rounded-lg shadow transition-all transform hover:scale-105 flex items-center gap-2 font-medium">
                    <i class="fas fa-plus"></i>Add Note
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div id="notes-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <dialog id="note-dialog" class="rounded-xl shadow-2xl p-0 w-full max-w-md bg-white dark:bg-dark text-gray-800 dark:text-gray-100">
        <div class="dialog-content p-6">
            <div class="dialog-header flex justify-between items-center mb-6">
                <h2 id="dialog-title" class="text-xl font-bold text-primary">Add New Note</h2>
                <button onclick="closeNoteDialog()" class="text-gray-400 hover:text-red-500 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <form id="note-form" onsubmit="saveNote(event)">
                <div class="mb-4">
                    <label class="block mb-1 text-sm">Title</label>
                    <input id="note-title" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-800 dark:border-gray-700">
                </div>

                <div class="mb-6">
                    <label class="block mb-1 text-sm">Content</label>
                    <textarea id="note-content" rows="5" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-800 dark:border-gray-700"></textarea>
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeNoteDialog()" class="px-4 py-2 rounded-lg dark:hover:bg-gray-700">Cancel</button>
                    <button type="submit" class="bg-primary text-white px-6 py-2 rounded-lg">Save</button>
                </div>
            </form>
        </div>
    </dialog>

    <script src="script.js"></script>

</body>
</html>
